name: Build and Publish Human Physiology

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Bootstrap source files
        shell: bash
        run: |
          if [ ! -f study-guides/week05-sensory.qmd ]; then
            cat bootstrap/part_* > /tmp/site.b64
            base64 -d /tmp/site.b64 | gunzip > /tmp/build_site.py
            python /tmp/build_site.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _quarto.yml styles.css index.qmd study-guides practice assessment SOURCE_MAP.md QA_AUDIT.md
            git commit -m "Generate Human Physiology Part II study site"
            git push origin main
          fi

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        run: quarto render

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
